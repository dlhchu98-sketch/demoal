name: Deploy Static Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static portal bundle
        run: |
          mkdir -p _site/static/js _site/data
          cp backend/static/index.html _site/index.html
          cp backend/static/js/*.js _site/static/js/
          if [ -f data/questions/questions_dataset.json ]; then
            cp data/questions/questions_dataset.json _site/data/questions_dataset.json
          fi
          # Fix script paths to relative for GitHub Pages subpath hosting (https://<user>.github.io/<repo>/)
          sed -i 's|src="/static/js/|src="./static/js/|g' _site/index.html
          cp _site/index.html _site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
