services:
  postgres:
    image: postgres:16-alpine
    container_name: legal-assistant-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-legal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_pass}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal_user} -d ${POSTGRES_DB:-legal_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legal_net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-assistant-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q 200 <&3' || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - legal_net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: legal-assistant-backend
    environment:
      APP_MODE: ${APP_MODE:-demo}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-legal_user}:${POSTGRES_PASSWORD:-legal_pass}@postgres:5432/${POSTGRES_DB:-legal_assistant}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-in-production}
      QDRANT_MODE: ${QDRANT_MODE:-remote}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-vietnam_legal_docs}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      MAX_SELF_CORRECTION_ATTEMPTS: ${MAX_SELF_CORRECTION_ATTEMPTS:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    volumes:
      - ./data:/app/data
    networks:
      - legal_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-assistant-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - legal_net
    restart: unless-stopped

networks:
  legal_net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
